[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vimax-image-worker"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "redis>=5.2.0",
    "boto3>=1.35.0",
    "pydantic>=2.10.0",
    "python-dotenv>=1.0.1",
    "pillow>=11.0.0",
    "httpx>=0.28.0",
    "opencv-python-headless>=4.10.0",
    "requests>=2.32.0",
    "tenacity>=9.0.0",
    "aiohttp>=3.11.0",
    "google-genai>=1.0.0",
]

[project.optional-dependencies]
# Agent 桥接（VIMAX_ROOT 挂载的 ViMax 框架）运行期导入所需的最小第三方集
vimax-agents = [
    "langchain>=0.3.26",
    "langchain-community>=0.3.27",
    "langchain-openai>=0.3.27",
    "scenedetect>=0.6.7",
    "langchain-text-splitters",
    "openai>=1.95.0",
    "moviepy>=2.2.1",
    "tenacity>=8.2.0",
    "chardet>=5.2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["vimax_image_worker"]

[project.scripts]
vimax-image-worker = "vimax_image_worker.main:main"
