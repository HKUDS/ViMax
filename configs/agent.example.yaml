# ViMax agent runtime local configuration template.
# Keep real keys out of commits. Prefer environment variables for shared or CI usage.

# For OpenAI-compatible / OpenRouter / Yunwu:
#   model_provider: openai
#   base_url: <YOUR_LLM_BASE_URL>
# For native Google Gemini:
#   model_provider: google
#   model: gemini-3.8-flash
llm:
  model_provider: openai
  model: <YOUR_LLM_MODEL>
  base_url: <YOUR_LLM_BASE_URL>
  api_key: ''

# For native Google:
#   provider: google
#   model: gemini-nano-banana-2.1
image:
  model: <YOUR_IMAGE_MODEL>
  base_url: <YOUR_IMAGE_BASE_URL>
  api_key: ''

# Keyframes: generate candidates concurrently and compare with the configured LLM.
# Set to 1 to generate one image without VLM selection. The LLM must support vision.
image_selection:
  num_candidates: 2

# For native Google:
#   provider: google
#   model: gemini-omni-1.1-flash
# Optional: aspect_ratio: "16:9" (default) or "9:16" (vertical/reels/shorts)
video:
  model: <YOUR_VIDEO_MODEL>
  base_url: <YOUR_VIDEO_BASE_URL>
  api_key: ''
  # aspect_ratio: '16:9'

# Optional. Fill these only when using novel2video planning.
embedding:
  model_provider: openai
  model: <YOUR_EMBEDDING_MODEL>
  base_url: <YOUR_EMBEDDING_BASE_URL>
  api_key: ''

# Optional. Fill these only when using novel2video planning.
reranker:
  model: <YOUR_RERANKER_MODEL>
  base_url: <YOUR_RERANKER_BASE_URL>
  api_key: ''
